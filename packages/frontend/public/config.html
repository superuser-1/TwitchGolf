<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twitch Golf — Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        color: #1b1b1b;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      select,
      input {
        width: 100%;
        max-width: 320px;
        padding: 6px 8px;
        font-size: 14px;

        margin-top: 14px;

        border-radius: 6px;

        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: #2f9e44;
        min-height: 18px;
      }
