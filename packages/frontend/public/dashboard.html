<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twitch Golf — Dashboard</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        color: #1b1b1b;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
        flex-wrap: wrap;
      }
      select {
        padding: 6px 8px;
        font-size: 14px;
      }
      button {
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        background: #9146ff;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary {
        background: #495057;
      }
      #phase {
        font-size: 13px;
        color: #495057;
        min-height: 18px;
      }
      #status {
        font-size: 13px;
        color: #2f9e44;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <h3>Twitch Golf — live dashboard</h3>
    <div id="phase">…</div>
    <div id="app">loading…</div>
    <div id="status"></div>
    <script src="./dashboard.js"></script>
  </body>
</html>
