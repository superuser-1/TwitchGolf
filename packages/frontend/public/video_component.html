<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twitch Golf</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #field {
        width: 100%;
        height: 100%;
        display: block;
      }
      #grant {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #9146ff;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      #status {
        position: absolute;
        left: 8px;
        bottom: 32px;
        color: #fff;
        font-size: 11px;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="field"></canvas>
      <button id="grant" hidden>Share identity to play</button>
      <div id="status"></div>
    </div>
    <script src="./video_component.js"></script>
  </body>
</html>
